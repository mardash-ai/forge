<rect width="1060" height="400" fill="#0b1220"/>
<text x="24" y="30" class="h">dorinda-site — marketing (dorinda.ai · www)</text>
<text x="24" y="50" class="sub">The simplest service — no DB, no auth, no mTLS. Deliberately the FIRST one through the §2.4 seam.</text>
