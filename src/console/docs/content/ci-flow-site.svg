<text x="738" y="240" class="ok">✓ site serving</text>
<rect x="24" y="272" width="1012" height="150" rx="9" fill="#141020" stroke="#a78bfa" stroke-width="1.5"/>
<text x="42" y="294" class="lane" fill="#c4b5fd">🔑 State that must already exist (else the stage fails, loudly)</text>
<text x="42" y="314" class="stk">WIF binding for the repo</text><text x="330" y="314" class="st">bootstrap registered it: repo ∈ github.repos in dorinda-shared-infra</text>
<text x="42" y="334" class="stk">Self-hosted runner ONLINE</text><text x="330" y="334" class="st">ci-runner MIG healthy; else jobs queue forever (silent)</text>
<text x="42" y="354" class="stk">Platform contract published</text><text x="330" y="354" class="st">gs://dorinda-tf-state/contract/prod-a.json — else plan refuses</text>
<text x="42" y="374" class="stk">Module pins all equal</text><text x="330" y="374" class="st">lint fails on mixed refs (0.79.20) — the Cloud-NAT class of bug</text>
<text x="42" y="394" class="stk">NEXT_PUBLIC_APP_URL build-arg</text><text x="330" y="394" class="st">same client-bundle hazard as web</text>
