<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="322" viewBox="0 0 1060 322" font-family="ui-sans-serif,-apple-system,Segoe UI,Roboto,sans-serif">
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b98ad"/></marker>
</defs>
<style>
text{fill:#e6edf7}.h{font-size:17px;font-weight:800}.sub{font-size:12.5px;fill:#8b98ad}
.lane{font-size:13px;font-weight:800}.trig{font-size:11px;fill:#c4cede}
.step{font-size:12px;font-weight:600}.note{font-size:10.5px;fill:#8b98ad}
.ok{font-size:12px;font-weight:700;fill:#4ade80}.st{font-size:11.5px;fill:#c4cede}.stk{font-size:11.5px;font-weight:700;fill:#fbbf24}
</style>
<rect width="1060" height="322" fill="#0b1220"/>
<text x="24" y="30" class="h">dorinda-shared-infra — the foundation</text>
<text x="24" y="50" class="sub">Owns every singleton: folder · projects · VPC + Cloud NAT · DNS · BOTH LB entries · certs · mTLS TrustConfig · IAM/WIF · OTLP collector. No release pipeline: it ships no code.</text>
<rect x="24" y="74" width="1012" height="84" rx="9" fill="#111a2e" stroke="#4c8dff" stroke-width="1.5"/>
<rect x="24" y="74" width="5" height="84" rx="2" fill="#4c8dff"/>
<text x="42" y="96" class="lane" fill="#4c8dff">infra.yml</text>
<text x="42" y="114" class="trig">▶ PR → plan · merge(infra/**) → apply+verify · nightly 06:17 UTC → drift</text>
<rect x="42" y="122" width="152" height="26" rx="6" fill="#16233f" stroke="#4c8dff"/>
<text x="52" y="138" class="step">lint</text>
<text x="52" y="152" class="note">schema · pins · fmt · validate</text>
<path d="M194 140 L212 140" stroke="#8b98ad" stroke-width="1.6" marker-end="url(#ar)"/>
<rect x="216" y="122" width="152" height="26" rx="6" fill="#16233f" stroke="#4c8dff"/>
<text x="226" y="138" class="step">plan</text>
<text x="226" y="152" class="note">contract gate first</text>
<path d="M368 140 L386 140" stroke="#8b98ad" stroke-width="1.6" marker-end="url(#ar)"/>
<rect x="390" y="122" width="152" height="26" rx="6" fill="#241a10" stroke="#f0b429"/>
<text x="400" y="138" class="step">apply</text>
<text x="400" y="152" class="note">§3.7 re-plan until empty</text>
<path d="M542 140 L560 140" stroke="#8b98ad" stroke-width="1.6" marker-end="url(#ar)"/>
<rect x="564" y="122" width="152" height="26" rx="6" fill="#241a10" stroke="#f0b429"/>
<text x="574" y="138" class="step">verify</text>
<text x="574" y="152" class="note">behaviour, not existence</text>
<text x="738" y="144" class="ok">✓ converged</text>
<rect x="24" y="176" width="1012" height="130" rx="9" fill="#141020" stroke="#a78bfa" stroke-width="1.5"/>
<text x="42" y="198" class="lane" fill="#c4b5fd">🔑 State that must already exist (else the stage fails, loudly)</text>
<text x="42" y="218" class="stk">org IAM: folderAdmin/orgAdmin</text><text x="330" y="218" class="st">bootstrap creates folder+projects; granted to mark@mardash.ai</text>
<text x="42" y="238" class="stk">otel-collector-config secret</text><text x="330" y="238" class="st">value present, else the collector never boots</text>
<text x="42" y="258" class="stk">OpenAI CA PEMs in infra/</text><text x="330" y="258" class="st">root + intermediate, SEPARATE files (a bundle is rejected)</text>
<text x="42" y="278" class="stk">GoDaddy _acme-challenge CNAMEs</text><text x="330" y="278" class="st">certs sit in PROVISIONING without them</text>
<text x="42" y="298" class="stk">apply publishes the contract</text><text x="330" y="298" class="st">every other stack is blocked until this one converges</text>
</svg>