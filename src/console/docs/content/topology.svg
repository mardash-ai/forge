<text x="20" y="26" class="t" font-size="16">Dorinda on GCP — production topology (live since 2026-07-30)</text>

<!-- clients -->
<rect x="20" y="50" width="150" height="46" class="b" fill="#1b2740" stroke="#4c8dff"/><text x="42" y="70">🧑 Browsers</text><text x="42" y="87" class="s">app · site</text>
<rect x="20" y="106" width="150" height="46" class="b" fill="#1b2740" stroke="#22d3ee"/><text x="42" y="126">🤖 Claude</text><text x="42" y="143" class="s">certless → api</text>
<rect x="20" y="162" width="150" height="46" class="b" fill="#1b2740" stroke="#a78bfa"/><text x="42" y="182">🤖 ChatGPT</text><text x="42" y="199" class="s">mTLS cert → mcp</text>

<!-- DNS -->
<rect x="230" y="98" width="130" height="70" class="b" fill="#111a2e" stroke="#f0b429"/><text x="248" y="122" class="t">GoDaddy DNS</text><text x="248" y="140" class="s">A @,app,api → LB-1</text><text x="248" y="155" class="s">A mcp → LB-2</text>

<!-- two LB entries -->
<rect x="420" y="50" width="200" height="88" class="b" fill="#14243f" stroke="#4c8dff" stroke-width="2"/>
<text x="438" y="74" class="t">Global LB · main</text><text x="438" y="92" class="s">34.54.142.191 · managed certs</text><text x="438" y="108" class="s">NO client cert ever requested</text><text x="438" y="124" class="s">(browser cert-picker hazard)</text>
<rect x="420" y="158" width="200" height="88" class="b" fill="#20143f" stroke="#a78bfa" stroke-width="2"/>
<text x="438" y="182" class="t">Global LB · mcp</text><text x="438" y="200" class="s">8.232.233.202 · ServerTlsPolicy</text><text x="438" y="216" class="s">ALLOW_INVALID_OR_MISSING</text><text x="438" y="232" class="s">TrustConfig = OpenAI CA</text>

<!-- cloud run row -->
<rect x="700" y="34" width="150" height="52" class="b" fill="#112b1e" stroke="#2fbf71"/><text x="716" y="56" class="t">dorinda-site</text><text x="716" y="74" class="s">Cloud Run · Next.js</text>
