<rect x="900" y="120" width="120" height="150" class="b" fill="#2b1c10" stroke="#f0b429" stroke-width="2"/>
<text x="914" y="144" class="t">Cloud SQL</text><text x="914" y="162" class="s">Postgres 16</text><text x="914" y="178" class="s">dorinda_api</text><text x="914" y="194" class="s">forge_platform</text><text x="914" y="216" class="s" fill="#4ade80">backups + PITR ✓</text><text x="914" y="232" class="s">private IP only</text><text x="914" y="248" class="s">zonal (HA later)</text>

