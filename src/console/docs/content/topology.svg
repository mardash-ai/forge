<rect x="700" y="158" width="150" height="72" class="b" fill="#112b1e" stroke="#2fbf71" stroke-width="2"/><text x="716" y="180" class="t">dorinda-api</text><text x="716" y="197" class="s">REST + 31 MCP tools</text><text x="716" y="213" class="s">mTLS guard (fail closed)</text>
<rect x="700" y="250" width="150" height="58" class="b" fill="#112b1e" stroke="#2fbf71"/><text x="716" y="272" class="t">forge data-plane</text><text x="716" y="289" class="s">auth · billing · OAuth</text>

