<rect x="24" y="74" width="5" height="84" rx="2" fill="#22d3ee"/>
<text x="42" y="96" class="lane" fill="#22d3ee">ci.yml</text>
<text x="42" y="114" class="trig">▶ every push + PR (GitHub-hosted — no GCP needed)</text>
<rect x="42" y="122" width="152" height="26" rx="6" fill="#16233f" stroke="#22d3ee"/>
<text x="52" y="138" class="step">typecheck</text>
<text x="52" y="152" class="note">tsc --noEmit</text>
<path d="M194 140 L212 140" stroke="#8b98ad" stroke-width="1.6" marker-end="url(#ar)"/>
<rect x="216" y="122" width="152" height="26" rx="6" fill="#16233f" stroke="#22d3ee"/>
<text x="226" y="138" class="step">vitest</text>
<text x="226" y="152" class="note">DB tests self-skip</text>
<path d="M368 140 L386 140" stroke="#8b98ad" stroke-width="1.6" marker-end="url(#ar)"/>
<rect x="390" y="122" width="152" height="26" rx="6" fill="#16233f" stroke="#22d3ee"/>
<text x="400" y="138" class="step">contract:check</text>
<text x="400" y="152" class="note">tool surface vs contract</text>
<path d="M542 140 L560 140" stroke="#8b98ad" stroke-width="1.6" marker-end="url(#ar)"/>
<rect x="564" y="122" width="152" height="26" rx="6" fill="#241a10" stroke="#f0b429"/>
<text x="574" y="138" class="step">audit gate</text>
<text x="574" y="152" class="note">ASVS V14 · expiring exceptions</text>
<text x="738" y="144" class="ok">✓ mergeable</text>
<rect x="24" y="170" width="1012" height="84" rx="9" fill="#111a2e" stroke="#4c8dff" stroke-width="1.5"/>
<rect x="24" y="170" width="5" height="84" rx="2" fill="#4c8dff"/>
<text x="42" y="192" class="lane" fill="#4c8dff">infra.yml</text>
<text x="42" y="210" class="trig">▶ PR → plan · merge(infra/**) → apply+verify · nightly 06:17 UTC → drift</text>
<rect x="42" y="218" width="152" height="26" rx="6" fill="#16233f" stroke="#4c8dff"/>
<text x="52" y="234" class="step">lint</text>
<text x="52" y="248" class="note">schema · pins · fmt · validate</text>
