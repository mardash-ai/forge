name: infra

# Push-gated terraform apply for the forge stack (e2e-runner infra in dorinda-prod).
# PR → plan (read-only, for review); merge to main → apply + §3.7 read-back + verify;
# nightly → drift detection.
#
# Auth: Workload Identity Federation — no service-account key ever exists (§2.5 rule 3).
# Runner: ubuntu-latest (github-hosted). Terraform contacts GCP via the public Cloud APIs, so
# no VPC access is needed for infra apply — only WIF credentials. The self-hosted pool is
# reserved for deploys that need private-network egress.
# Approval: Mark's 2026-08-11 authorization covers the e2e-runner apply (Cloud SQL e2e-results
#   + Cloud Run Job e2e-runner + SA + secrets). Apply-time approval re-stated in PROVIDER_ACCOUNTS.md.

on:
  pull_request:
    paths: ['infra/**', 'forge.infra.json', 'terraform/modules/e2e-runner/**']
  push:
    branches: [main]
    paths: ['infra/**', 'forge.infra.json', 'terraform/modules/e2e-runner/**']
  schedule:
    - cron: '23 7 * * *' # nightly drift check — a console change must break a build
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # WIF
  packages: read # read GHCR to resolve the control-plane image digest (t-runner-image step)

env:
  ENV_NAME: prod-a

jobs:
  infra:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to GCP (WIF — no keys)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/754310769371/locations/global/workloadIdentityPools/github-ci/providers/github-oidc
          service_account: forge-deployer@dorinda-prod.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Install forge CLI deps
        run: npm ci --omit=optional

      - name: Resolve runner image digest (t-runner-image)
        # Reads the Docker-Content-Digest of ghcr.io/<owner>/forge-control-plane:latest from GHCR
        # via the OCI Distribution v2 API. The resulting digest-pinned reference is injected as
        # TF_VAR_runner_image so every plan/apply declares the exact current GHCR image — no drift
        # between the declared image and the actual :latest. GITHUB_TOKEN (packages: read) grants
        # pull access to GHCR without a separate PAT.
        id: t-runner-image
        run: |
          token=$(printf '%s' "${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}" | base64 -w0)
          bearer=$(curl -fsSL \
            -H "Authorization: Basic ${token}" \
            "https://ghcr.io/token?scope=repository:${{ github.repository_owner }}/forge-control-plane:pull&service=ghcr.io" \
            | jq -r .token)
          digest=$(curl -fsSI \
            -H "Authorization: Bearer ${bearer}" \
            -H "Accept: application/vnd.oci.image.index.v1+json,application/vnd.docker.distribution.manifest.list.v2+json,application/vnd.docker.distribution.manifest.v2+json" \
            "https://ghcr.io/v2/${{ github.repository_owner }}/forge-control-plane/manifests/latest" \
            | grep -i '^docker-content-digest:' | tr -d '\r' | awk '{print $2}')
          if [[ -z "${digest}" ]]; then
            echo "::error::t-runner-image: could not resolve GHCR digest for forge-control-plane:latest"
            exit 1
          fi
          image="ghcr.io/${{ github.repository_owner }}/forge-control-plane@${digest}"
          echo "image=${image}" >> "$GITHUB_OUTPUT"
          echo "t-runner-image: ${image}"

      - name: Lint (fmt + validate — before any provider call)
        run: node node_modules/.bin/tsx src/infra/cli.ts lint

      - name: Plan (PRs and drift schedule)
        if: github.event_name != 'push'
        env:
          TF_VAR_runner_image: ${{ steps.t-runner-image.outputs.image }}
        run: node node_modules/.bin/tsx src/infra/cli.ts plan --env "$ENV_NAME"

      - name: Apply + read-back (merges to main only)
        if: github.event_name == 'push'
        env:
          TF_VAR_runner_image: ${{ steps.t-runner-image.outputs.image }}
        run: node node_modules/.bin/tsx src/infra/cli.ts apply --env "$ENV_NAME"

      - name: Verify — gcloud readback (post-apply gate)
        if: github.event_name == 'push'
        run: node node_modules/.bin/tsx src/infra/cli.ts verify --env "$ENV_NAME"

      - name: Drift gate (schedule only) — exits 2 on drift
        if: github.event_name == 'schedule'
        env:
          TF_VAR_runner_image: ${{ steps.t-runner-image.outputs.image }}
        run: node node_modules/.bin/tsx src/infra/cli.ts status --env "$ENV_NAME"
