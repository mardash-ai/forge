name: infra

# Push-gated terraform apply for the forge stack (e2e-runner infra in dorinda-prod).
# PR → plan (read-only, for review); merge to main → apply + §3.7 read-back + verify;
# nightly → drift detection.
#
# Auth: Workload Identity Federation — no service-account key ever exists (§2.5 rule 3).
# Runner: ubuntu-latest (github-hosted). Terraform contacts GCP via the public Cloud APIs, so
# no VPC access is needed for infra apply — only WIF credentials. The self-hosted pool is
# reserved for deploys that need private-network egress.
# Approval: Mark's 2026-08-11 authorization covers the e2e-runner apply (Cloud SQL e2e-results
#   + Cloud Run Job e2e-runner + SA + secrets). Apply-time approval re-stated in PROVIDER_ACCOUNTS.md.

on:
  pull_request:
    paths: ['infra/**', 'forge.infra.json', 'terraform/modules/e2e-runner/**']
  push:
    branches: [main]
    paths: ['infra/**', 'forge.infra.json', 'terraform/modules/e2e-runner/**']
  schedule:
    - cron: '23 7 * * *' # nightly drift check — a console change must break a build
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # WIF
  # (no packages: read — the GHCR digest resolution it existed for was removed 2026-08-13)

env:
  ENV_NAME: prod-a

jobs:
  infra:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to GCP (WIF — no keys)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/754310769371/locations/global/workloadIdentityPools/github-ci/providers/github-oidc
          service_account: forge-deployer@dorinda-prod.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Install forge CLI deps
        run: npm ci --omit=optional

      # ⛔ REMOVED 2026-08-13: this step resolved ghcr.io/<owner>/forge-control-plane:latest and
      # injected it as TF_VAR_runner_image, so every apply pointed the e2e-runner job at forge's
      # CONTROL PLANE image — the wrong program (the E2E runner is forge-hat, the acceptance
      # harness) and one Cloud Run cannot even pull (GHCR requires auth). The job went Ready=False
      # with ContainerImageUnauthorized and every "Run tests" click returned FAILED_PRECONDITION.
      #
      # The runner image is owned by forge-hat's publish-image workflow: it builds, pushes to
      # Artifact Registry, rolls this job by digest and verifies the read-back. The module carries
      # ignore_changes on the image so Terraform no longer reverts it. Nothing needs to be resolved
      # here.

      - name: Lint (fmt + validate — before any provider call)
        run: node node_modules/.bin/tsx src/infra/cli.ts lint

      - name: Plan (PRs and drift schedule)
        if: github.event_name != 'push'
        env:
        run: node node_modules/.bin/tsx src/infra/cli.ts plan --env "$ENV_NAME"

      - name: Apply + read-back (merges to main only)
        if: github.event_name == 'push'
        env:
        run: node node_modules/.bin/tsx src/infra/cli.ts apply --env "$ENV_NAME"

      - name: Verify — gcloud readback (post-apply gate)
        if: github.event_name == 'push'
        run: node node_modules/.bin/tsx src/infra/cli.ts verify --env "$ENV_NAME"

      - name: Drift gate (schedule only) — exits 2 on drift
        if: github.event_name == 'schedule'
        env:
        run: node node_modules/.bin/tsx src/infra/cli.ts status --env "$ENV_NAME"
