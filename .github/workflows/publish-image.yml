name: Publish control-plane image

# Publishes the Forge CONTROL PLANE image to GitHub Container Registry (GHCR).
# Triggers:
#   - pushing a version tag (e.g. v0.1.0) -> publishes :0.1.0 and :latest
#   - manual run from the Actions tab      -> publishes :latest
#
# Images are arm64-only, built NATIVELY on an arm64 runner (no QEMU) — the only runtime target is the
# arm64 Apple-Silicon box. (If an x86 host ever needs it, add linux/amd64 back + a QEMU step, or a matrix.)
#
# The image name uses the repository owner, so it works for any org/user that
# hosts this repo (e.g. ghcr.io/mardash-ai/forge-control-plane).

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  # ── TEST GATE (added 2026-07-30) ────────────────────────────────────────────────────────────
  # Publishes previously ran with NO dependency on the test suite: a tag (or, for the data-plane,
  # ANY push to main) published straight from the runner, red tests or not. Mark asked how he could
  # know a release only ships on green — the honest answer was that he could not. Now the publish
  # job cannot start until this one passes, in the SAME workflow, so the guarantee is atomic rather
  # than a convention about looking at another workflow's badge.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      # Formatting gates the PUBLISH, not just ci.yml: consumers (dorinda-forge-console) run
      # `prettier --check` against the pinned forge ref, so an unformatted tag is unadoptable.
      # v1.18.4, v1.18.5 and v1.19.0 all shipped unformatted on 2026-08-05 because only ci.yml
      # checked — and a tag push doesn't wait for ci.yml.
      - run: npx prettier --check .
      - run: npm test
      - run: npm run typecheck
      # The console SPA compiles ONLY inside Dockerfile.console — at consumer adopt time. Without
      # this, a tag whose SPA doesn't build (v1.19.1: TS errors in App.tsx) publishes fine and
      # every consumer's release then fails at docker build. Compile it here so the tag can't.
      - run: cd console && npm ci && npm run build

  publish:
    needs: [test]
    # Multi-arch build: linux/arm64 (Apple Silicon Mac mini / runtime host) + linux/amd64
    # (Google Cloud Run us-east1, x86 execution environment). The arm64 runner builds arm64
    # natively; amd64 is cross-compiled via QEMU (adds ~3-5 min). The resulting OCI index
    # manifest covers both platforms — Cloud Run pulls the amd64 layer, the Mac mini pulls arm64.
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU (for linux/amd64 cross-build on arm64 runner)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: linux/amd64

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/forge-control-plane
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=Forge Control Plane
            com.mardash-ai.plane=control

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64,linux/amd64
          push: true
          build-args: |
            FORGE_COMMIT=${{ github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # ── RELEASE ASSETS ──────────────────────────────────────────────────────────────────────────
  # Attach platform-model.json, platform-changes.json, and platform-changes.md to the GitHub
  # release for the tag. Runs only on tag pushes (not on workflow_dispatch). The semantic diff
  # is computed against the previous semver tag; if no previous tag exists, all items are "added".
  release-assets:
    needs: [test]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history for git show <prevTag>)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Resolve previous semver tag
        id: tags
        run: |
          CURRENT="${GITHUB_REF_NAME}"
          # Find the most recent tag before this one, semver-ordered.
          PREV=$(git tag --sort=-v:refname \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
            | grep -v "^${CURRENT}$" \
            | head -1 || true)
          if [ -z "$PREV" ]; then PREV="none"; fi
          echo "current=${CURRENT}" >> "$GITHUB_OUTPUT"
          echo "prev=${PREV}"       >> "$GITHUB_OUTPUT"
          echo "Current tag: ${CURRENT}  Previous tag: ${PREV}"

      - name: Generate semantic diff
        run: npm run diff:platform-model -- ${{ steps.tags.outputs.prev }} ${{ steps.tags.outputs.current }}

      - name: Create or update GitHub release and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.tags.outputs.current }}"
          # Create the release if it doesn't already exist (gh exits 0 if it does).
          gh release create "${TAG}" \
            --title "${TAG}" \
            --generate-notes \
            --verify-tag \
            2>/dev/null || true
          # Upload the three model/diff files (--clobber replaces if already present).
          gh release upload "${TAG}" \
            platform-model.json \
            platform-changes.json \
            platform-changes.md \
            --clobber
